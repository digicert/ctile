version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: monthly
  groups:
    go-deps:
      applies-to: version-updates
      patterns:
        - "*"

- package-ecosystem: github-actions
  directory: /.github/workflows
  schedule:
    interval: monthly
  groups:
    github-actions-deps:
      applies-to: version-updates
      patterns:
        - "*"

- package-ecosystem: docker
  directories:
    - /
  schedule:
    interval: monthly
  groups:
    docker-deps:
      applies-to: version-updates
      patterns:
        - "*"
